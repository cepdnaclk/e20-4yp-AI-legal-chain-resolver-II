<svg width="1200" height="760" viewBox="0 0 1200 760" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Retrieval benchmark comparison</title>
  <desc id="desc">Bar chart comparing hit rate and mean reciprocal rank for FAISS, BM25, and Hybrid retrieval.</desc>
  <rect width="1200" height="760" rx="28" fill="#F7FAFE"/>
  <rect x="30" y="30" width="1140" height="700" rx="24" fill="white" stroke="#D7E2EE"/>
  <text x="80" y="95" fill="#083B6D" font-family="Segoe UI, Arial, sans-serif" font-size="34" font-weight="700">MCQ Retrieval Benchmark</text>
  <text x="80" y="132" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="18">Metrics extracted from repository result JSON files for FAISS, BM25, and Hybrid retrieval.</text>
  <line x1="120" y1="590" x2="1080" y2="590" stroke="#AFC4DA" stroke-width="2"/>
  <line x1="120" y1="500" x2="1080" y2="500" stroke="#E5EEF7" stroke-width="2"/>
  <line x1="120" y1="410" x2="1080" y2="410" stroke="#E5EEF7" stroke-width="2"/>
  <line x1="120" y1="320" x2="1080" y2="320" stroke="#E5EEF7" stroke-width="2"/>
  <line x1="120" y1="230" x2="1080" y2="230" stroke="#E5EEF7" stroke-width="2"/>
  <line x1="120" y1="140" x2="1080" y2="140" stroke="#E5EEF7" stroke-width="2"/>
  <text x="72" y="596" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">0.0</text>
  <text x="72" y="506" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">0.2</text>
  <text x="72" y="416" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">0.4</text>
  <text x="72" y="326" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">0.6</text>
  <text x="72" y="236" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">0.8</text>
  <text x="72" y="146" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">1.0</text>
  <text x="235" y="640" text-anchor="middle" fill="#083B6D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">FAISS</text>
  <text x="600" y="640" text-anchor="middle" fill="#083B6D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">BM25</text>
  <text x="965" y="640" text-anchor="middle" fill="#083B6D" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Hybrid</text>
  <rect x="175" y="257" width="95" height="333" rx="14" fill="#0B5CAB"/>
  <rect x="290" y="361" width="95" height="229" rx="14" fill="#D97A1D"/>
  <text x="222.5" y="245" text-anchor="middle" fill="#0B5CAB" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.74</text>
  <text x="337.5" y="349" text-anchor="middle" fill="#A55B12" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.51</text>
  <rect x="540" y="176" width="95" height="414" rx="14" fill="#0B5CAB"/>
  <rect x="655" y="212" width="95" height="378" rx="14" fill="#D97A1D"/>
  <text x="587.5" y="164" text-anchor="middle" fill="#0B5CAB" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.92</text>
  <text x="702.5" y="200" text-anchor="middle" fill="#A55B12" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.84</text>
  <rect x="905" y="149" width="95" height="441" rx="14" fill="#0B5CAB"/>
  <rect x="1020" y="352" width="95" height="238" rx="14" fill="#D97A1D"/>
  <text x="952.5" y="137" text-anchor="middle" fill="#0B5CAB" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.98</text>
  <text x="1067.5" y="340" text-anchor="middle" fill="#A55B12" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">0.53</text>
  <rect x="820" y="90" width="250" height="72" rx="18" fill="#EEF4FB" stroke="#D7E2EE"/>
  <rect x="845" y="116" width="18" height="18" rx="4" fill="#0B5CAB"/>
  <text x="875" y="131" fill="#102033" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">Hit Rate</text>
  <rect x="955" y="116" width="18" height="18" rx="4" fill="#D97A1D"/>
  <text x="985" y="131" fill="#102033" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600">MRR</text>
  <text x="80" y="700" fill="#546579" font-family="Segoe UI, Arial, sans-serif" font-size="16">Higher is better for both metrics. Hybrid retrieval gives the best hit rate, while BM25 remains strongest in rank quality.</text>
</svg>
